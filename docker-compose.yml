services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threats}
      POSTGRES_USER: ${POSTGRES_USER:-threats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: host=postgres user=${POSTGRES_USER:-threats} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set} dbname=${POSTGRES_DB:-threats} port=5432 sslmode=disable
      SERVER_ADDRESS: ":8080"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  backend:
  edge:
