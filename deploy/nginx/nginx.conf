user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    map $request_method $get_limit_key {
        default "";
        GET $binary_remote_addr;
    }
    map $request_method $write_limit_key {
        default "";
        POST $binary_remote_addr;
        PUT $binary_remote_addr;
        PATCH $binary_remote_addr;
    }
    map $request_method $delete_limit_key {
        default "";
        DELETE $binary_remote_addr;
    }

    limit_req_zone $get_limit_key zone=get_per_ip:10m rate=60r/m;
    limit_req_zone $write_limit_key zone=write_per_ip:10m rate=20r/m;
    limit_req_zone $delete_limit_key zone=delete_per_ip:10m rate=10r/m;
    limit_req_status 429;

    upstream threat_api {
        server api:8080;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
